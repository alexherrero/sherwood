name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

# One run per pull request. A new push cancels the run still going on the old
# head, so an old head can never arm the merge.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# What holds a Dependabot merge, and where:
#
# - The "Branch Rules" ruleset on main requires seven of ci.yml's jobs on every
#   pull request: Build (v1), Go vet, Go lint, Go tests (race), Python helper
#   tests, Credential scan and Container build. GitHub holds an armed
#   auto-merge until all seven pass on the head commit, so a flaky job that
#   passes on re-run still merges, with no help from this workflow.
# - Go vulnerability check is left out of the ruleset on purpose: it reads the
#   live advisory database, so a new advisory with no fix would block every
#   merge. This workflow holds it for Dependabot's pull requests instead, by
#   arming only after it passes on the head commit.
# - Only semver patch and minor updates arm. Docker base-image bumps never do:
#   CI's Python tests run on CI's Python, not the image's, so nothing here
#   tests what such a bump changes. The operator merges those by hand.
jobs:
  automerge:
    name: Dependabot auto-merge
    # Dependabot's pull requests only, whoever pushed: a lock.sh fix or a
    # branch update by the operator re-arms the same way Dependabot's own
    # push does. fetch-metadata reads the pull request's first commit and
    # refuses unless Dependabot made and signed it.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # An auto-merge armed for an earlier head stays armed through a push, and
      # the ruleset does not require the vulnerability check. Take it back
      # first; the steps below re-arm it for this commit if it qualifies.
      - name: Disarm any earlier auto-merge
        shell: bash
        run: |
          armed=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$armed" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "Auto-merge disarmed until $HEAD_SHA qualifies again."
          fi

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Checks that must pass on this exact commit before arming, beyond the
      # seven the ruleset already holds. A check that is missing, skipped,
      # cancelled or failed refuses; so does a timeout. Only GitHub Actions'
      # check runs (app id 15368, the id the ruleset names) count, and when a
      # job ran more than once on the commit, its newest run decides. To
      # recover from a flaky failure here, re-run the failed check and then
      # this job.
      - name: Wait for the vulnerability check
        id: gate
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        shell: bash
        run: |
          set -euo pipefail
          required=()
          while IFS= read -r name; do required+=("$name"); done <<'EOF'
          Go vulnerability check
          EOF

          for _ in $(seq 1 50); do
            if ! runs=$(gh api --paginate \
                "repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=all&per_page=100" \
                --jq '.check_runs[] | select(.app.id == 15368) | [.name, .status, (.conclusion // ""), .id] | @tsv'); then
              echo "Could not read the checks; trying again."
              sleep 30
              continue
            fi
            # Newest run first, so the first row per name is the one that counts.
            runs=$(sort -t$'\t' -k4,4nr <<<"$runs")

            waiting=()
            for name in "${required[@]}"; do
              row=$(awk -F'\t' -v n="$name" '$1 == n { print; exit }' <<<"$runs")
              if [ -z "$row" ]; then
                waiting+=("$name: not reported yet")
                continue
              fi
              IFS=$'\t' read -r _ status conclusion _ <<<"$row"
              if [ "$status" != completed ]; then
                waiting+=("$name: $status")
                continue
              fi
              if [ "$conclusion" != success ]; then
                echo "::error::Check '$name' finished '$conclusion' on $HEAD_SHA; not arming."
                exit 1
              fi
            done

            if [ "${#waiting[@]}" -eq 0 ]; then
              echo "${required[*]} passed on $HEAD_SHA."
              exit 0
            fi
            echo "Waiting on: $(IFS=';'; echo "${waiting[*]}")"
            sleep 30
          done

          echo "::error::Timed out waiting on $HEAD_SHA; not arming."
          exit 1

      # Arm for the commit the gate checked and no other: if the head has
      # moved on, GitHub refuses, and the new head's own run decides. GitHub
      # then merges once the ruleset's seven checks pass on this commit.
      - name: Enable auto-merge
        if: steps.gate.outcome == 'success'
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
